<!-- Online room art: the band's page, the online world's placeholder room (worlds spec, "Placeholder worlds"). Drawn to docs/design/STYLE.md; the cat is board 2's, as in art/opening/scene.svg.
     The band has no name yet, so the page header keeps the canvas's [BAND NAME] placeholder.
     Layers follow docs/design/STYLE.md "Scene build": one <g id="layer-*"> per layer, back to front.
     Rendered to PNG by frontend/scripts/render-art.mjs; do not hand-edit the PNGs. -->
