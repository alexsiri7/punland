<!-- Dream room art: the songwriting dream, the dream world's placeholder room (worlds spec, "Placeholder worlds"). Drawn to docs/design/STYLE.md; the cat is board 2's, as in art/opening/scene.svg.
     The flyer actor is street dream material: the room engine only shows it once the cat has picked up the flyer outside The Three Crows.
     Layers follow docs/design/STYLE.md "Scene build": one <g id="layer-*"> per layer, back to front.
     Rendered to PNG by frontend/scripts/render-art.mjs; do not hand-edit the PNGs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="A dusk dream: rooftops of Punland float upside down in a violet sky crossed by drifting music staves; an empty little stage sits on a slab of pavement hanging in the air; the Open Mic flyer drifts above it, glowing; the ginger cat in his blue hoodie stands on a floating kerb, eyes on the stage">
<style>
.p-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.p-sign{font-family:'Bebas Neue',sans-serif;text-anchor:middle}
.p-small{font-family:'Inter',sans-serif;font-weight:500;text-anchor:middle}
</style>
