<?xml version="1.0" encoding="UTF-8"?>
<!-- The Song Master's flat: his room above the High Street, where the lesson happens.
     Drawn to docs/design/STYLE.md; the cat is board 2's, as in rooms/feed.svg. The placeholder scene model is laid out over it
     (frontend/scripts/make-placeholders.mjs), so its shapes, the model and the room's floor points line up.
     Layers follow docs/design/STYLE.md "Scene build": one <g id="layer-*"> per layer, back to front. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="The Song Master's small flat at dusk: violet walls, a window onto the night street, a wooden chair and an old upright piano; the Song Master, an old rat in a lilac cardigan, waits to give his lesson; the ginger cat in his blue hoodie stands by the green door">
<style>
.p-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.p-sign{font-family:'Bebas Neue',sans-serif;text-anchor:middle}
.p-small{font-family:'Inter',sans-serif;font-weight:500;text-anchor:middle}
</style>
<defs>
<linearGradient id="p-sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" style="stop-color:#2E3A52"></stop>
<stop offset="0.6" style="stop-color:#6E6478"></stop>
<stop offset="1" style="stop-color:#C98A6C"></stop>
</linearGradient>
<filter id="p-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.09  0 0 0 0.16 0"></feColorMatrix></filter>
</defs>

